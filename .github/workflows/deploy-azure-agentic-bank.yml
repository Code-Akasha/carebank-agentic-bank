name: Deploy Agentic Bank to Azure

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: azure-agentic-bank-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: carebankacr1778676688.azurecr.io
  IMAGE_NAME: carebank-agentic-bank
  CONTAINER_APP_NAME: agentic-bank
  RESOURCE_GROUP: carebank-rg

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name carebankacr1778676688

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: carebankacr1778676688
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
